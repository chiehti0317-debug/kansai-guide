name: Collect licensed booklet photographs
on:
  push:
    branches: [booklet-assets-20260928]
    paths: ['.github/workflows/booklet-assets.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch alternative high-resolution licensed photographs
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, urllib.parse, urllib.request, json, time
          out=pathlib.Path('booklet-assets'); out.mkdir()
          items=[
            ('amano_summer','Amanohashidate 2008-8-13.jpg','osakaosaka','Public domain (PD-self)'),
            ('daruma_close','Daruma Dolls Osaka.JPG','EllieRH','CC BY-SA 4.0'),
            ('daruma_banzai','Daruma dolls at Katsuo-ji 20100102.jpg','Banzai Hiroaki','CC BY 2.0')
          ]
          records=[]
          for key,name,author,lic in items:
            filename=name.replace(' ','_'); h=hashlib.md5(filename.encode()).hexdigest()
            original='https://upload.wikimedia.org/wikipedia/commons/'+h[0]+'/'+h[:2]+'/'+urllib.parse.quote(filename)
            source='https://commons.wikimedia.org/wiki/File:'+urllib.parse.quote(filename)
            try:
              req=urllib.request.Request(original,headers={'User-Agent':'KansaiBookletAssetResearch/1.0 (personal print booklet; Wikimedia attribution preserved)'})
              with urllib.request.urlopen(req,timeout=60) as r: data=r.read(30000000)
              if not data.startswith(b'\xff\xd8'): raise ValueError('Not a JPEG')
              target=key+'.jpg'; (out/target).write_bytes(data)
              records.append({'id':key,'file':target,'title':name,'author':author,'license':lic,'source':source,'original_url':original,'download_url':original,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              print(key,len(data),lic,flush=True)
            except Exception as e: print(key,'unavailable',str(e),flush=True)
            (out/'alternatives.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
            time.sleep(8)
          PY
      - name: Return research assets, not website content
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: licensed-booklet-alternatives
          path: booklet-assets/
          retention-days: 1
          compression-level: 0
